name: Build Android APK

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: |
          unzip -o GigaLoteriasAndroid_0.2.zip -d project_extracted
          if [ -f "project_extracted/gradlew" ]; then
            mv project_extracted/* .
          elif [ -d "project_extracted/GigaLoteriasAndroid_0.2" ]; then
            mv project_extracted/GigaLoteriasAndroid_0.2/* .
          fi
          chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GigaLoterias-APK
          path: app/build/outputs/apk/debug/app-debug.apk
